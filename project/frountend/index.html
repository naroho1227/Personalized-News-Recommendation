<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>뉴스 추천</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 860px;
      margin: 0 auto;
      background: #f5f5f5;
    }

    h1 {
      color: #222;
    }

    h2 {
      font-size: 1rem;
      color: #444;
      margin: 0 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    input,
    select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #6b7280;
      color: #fff;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.82rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #error {
      color: #dc2626;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    #success {
      color: #16a34a;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    /* 탭 전환 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background: #fff;
    }

    .tab.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* 막대그래프 */
    #chart {
      margin-bottom: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 0.82rem;
    }

    .bar-label {
      width: 90px;
      text-align: right;
      color: #555;
    }

    .bar-bg {
      flex: 1;
      background: #e5e7eb;
      border-radius: 4px;
      height: 16px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 4px;
      transition: width 0.4s;
    }

    .bar-pct {
      width: 42px;
      color: #333;
    }

    /* 뉴스 목록 */
    .news-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-item h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
    }

    .news-item p {
      margin: 0 0 6px;
      font-size: 0.82rem;
      color: #555;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .news-btns {
      display: flex;
      gap: 6px;
    }

    #authSection {}

    #mainSection {
      display: none;
    }

    #userInfo {
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>📰 뉴스 추천 시스템</h1>

  <!-- ── 인증 영역 ──────────────────────────────── -->
  <div id="authSection">
    <div class="card">
      <div class="tabs">
        <div class="tab active" onclick="showTab('login')">로그인</div>
        <div class="tab" onclick="showTab('register')">회원가입</div>
      </div>

      <!-- 로그인 폼 -->
      <div id="loginForm">
        <input id="loginEmail" type="email" placeholder="이메일" />
        <input id="loginPassword" type="password" placeholder="비밀번호" />
        <button class="btn-primary" onclick="doLogin()">로그인</button>
      </div>

      <!-- 회원가입 폼 -->
      <div id="registerForm" style="display:none">
        <input id="regEmail" type="email" placeholder="이메일" />
        <input id="regPassword" type="password" placeholder="비밀번호" />
        <input id="regNickname" type="text" placeholder="닉네임" />
        <select id="regInterest">
          <option value="">관심사 선택</option>
          <option value="general">general</option>
          <option value="technology">technology</option>
          <option value="business">business</option>
          <option value="sports">sports</option>
          <option value="science">science</option>
          <option value="health">health</option>
          <option value="entertainment">entertainment</option>
        </select>
        <button class="btn-primary" onclick="doRegister()">회원가입</button>
      </div>

      <div id="error"></div>
      <div id="success"></div>
    </div>
  </div>

  <!-- ── 메인 영역 (로그인 후) ──────────────────── -->
  <div id="mainSection">
    <div id="userInfo"></div>

    <!-- 카테고리 점수 막대그래프 -->
    <div class="card">
      <h2>📊 카테고리 관심도</h2>
      <div id="chart"></div>
    </div>

    <!-- 추천 뉴스 -->
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
        <h2 style="margin:0">🗞 추천 뉴스</h2>
        <button class="btn-primary" onclick="loadNews()">추천 받기</button>
        <button class="btn-secondary btn-sm" onclick="doLogout()">로그아웃</button>
      </div>
      <div id="newsList"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
