<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personalized-News-Recommendation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0d0d0d;
      --paper: #f5f2eb;
      --accent: #c0392b;
      --accent2: #2c3e50;
      --muted: #888;
      --border: #d8d3c8;
      --card-bg: #ffffff;
      --bar-bg: #e8e4dc;
      --tag-general: #2c3e50;
      --tag-technology: #1a6b8a;
      --tag-business: #7d5a00;
      --tag-sports: #1a7a3e;
      --tag-science: #5b2d8e;
      --tag-health: #a0302e;
      --tag-entertainment: #b5450b;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── MASTHEAD ── */
    .masthead {
      background: var(--ink);
      color: white;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--accent);
    }

    .masthead-logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: white;
    }

    .masthead-logo span {
      color: var(--accent);
    }

    .masthead-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    .user-badge .avatar {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: white;
      color: white;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-box {
      background: white;
      width: 420px;
      padding: 48px 44px;
      border-top: 4px solid var(--accent);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    }

    .auth-logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .auth-logo span {
      color: var(--accent);
    }

    .auth-tagline {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 32px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 28px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .auth-field input,
    .auth-field select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--paper);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-field input:focus,
    .auth-field select:focus {
      border-color: var(--accent);
    }

    .auth-field select option {
      background: white;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: white;
      border: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent);
    }

    .auth-error {
      color: var(--accent);
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
    }


    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;
    }


    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title .icon {
      margin-right: 8px;
    }


    .sidebar-card {
      background: white;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 24px;
    }

    .interest-bar-item {
      margin-bottom: 12px;
    }

    .interest-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
      text-transform: capitalize;
    }

    .interest-bar-label .pct {
      color: var(--muted);
    }

    .interest-bar-track {
      height: 6px;
      background: var(--bar-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .interest-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }


    .recommend-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .recommend-btn:hover {
      background: #a93226;
    }

    .recommend-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }


    .news-feed {}


    .skeleton-card {
      background: white;
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 16px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-line {
      height: 14px;
      background: var(--bar-bg);
      border-radius: 3px;
      margin-bottom: 10px;
    }

    .skeleton-line.wide {
      width: 80%;
    }

    .skeleton-line.medium {
      width: 55%;
    }

    .skeleton-line.short {
      width: 30%;
      height: 10px;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }


    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 22px 24px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      transition: box-shadow 0.2s, transform 0.2s;
      animation: fadeSlideIn 0.4s ease both;
    }

    .news-card:hover {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.09);
      transform: translateY(-2px);
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .news-card-body {
      min-width: 0;
    }

    .news-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
      color: white;
      margin-bottom: 10px;
    }

    .news-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .news-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-actions {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-view {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-view:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .btn-read {
      padding: 7px 14px;
      background: var(--ink);
      border: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-read:hover {
      background: var(--accent);
    }

    .news-number {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 900;
      color: var(--border);
      line-height: 1;
      margin-bottom: 4px;
      text-align: right;
    }


    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .big-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--ink);
      margin-bottom: 8px;
    }


    .error-msg {
      background: #fff5f5;
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 16px;
    }


    .date-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }



    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      font-size: 13px;
      border-left: 3px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      z-index: 300;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }


    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }

      .masthead {
        padding: 0 16px;
      }

      .news-card {
        grid-template-columns: 1fr;
      }

      .news-actions {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>


  <header class="masthead">
    <div class="masthead-logo">Personal<span>NEWS</span></div>
    <div class="masthead-right" id="mastheadRight" style="display:none">
      <div class="user-badge">
        <div class="avatar" id="avatarInitial">?</div>
        <span id="mastheadNickname">사용자</span>
      </div>
      <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
  </header>


  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <div class="auth-logo">NEWS<span>Recommendation</span></div>
      <div class="auth-tagline">개인 맞춤형 뉴스 추천</div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">로그인</div>
        <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">회원가입</div>
      </div>


      <div id="loginForm">
        <div class="auth-field">
          <label>이메일</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" />
        </div>
        <div class="auth-field">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="••••••••"
            onkeydown="if(event.key==='Enter')doLogin()" />
        </div>
        <button class="btn-primary" onclick="doLogin()">로그인</button>
      </div>


      <div id="registerForm" style="display:none">
        <div class="auth-field">
          <label>이메일</label>
          <input type="email" id="regEmail" placeholder="your@email.com" />
        </div>
        <div class="auth-field">
          <label>비밀번호</label>
          <input type="password" id="regPassword" placeholder="••••••••" />
        </div>
        <div class="auth-field">
          <label>닉네임</label>
          <input type="text" id="regNickname" placeholder="뉴스픽 닉네임" />
        </div>
        <div class="auth-field">
          <label>관심 카테고리</label>
          <select id="regInterest">
            <option value="general">일반 (General)</option>
            <option value="technology">기술 (Technology)</option>
            <option value="business">경제 (Business)</option>
            <option value="sports">스포츠 (Sports)</option>
            <option value="science">과학 (Science)</option>
            <option value="health">건강 (Health)</option>
            <option value="entertainment">엔터테인먼트 (Entertainment)</option>
          </select>
        </div>
        <button class="btn-primary" onclick="doRegister()">가입하기</button>
      </div>

      <div class="auth-error" id="authError"></div>
    </div>
  </div>


  <div class="main-container">


    <main>
      <div class="date-header" id="todayDate"></div>

      <div class="section-title">
        <span><span class="icon">📰</span>오늘의 추천 뉴스</span>
        <button class="recommend-btn" id="recommendBtn" onclick="loadNews()"
          style="width:auto;padding:10px 20px;font-size:13px;">
          새로 추천받기
        </button>
      </div>


      <div id="errorMsg"></div>
      <div id="newsFeed">
        <div class="empty-state">
          <div class="big-icon">📋</div>
          <h3>뉴스를 불러와보세요</h3>
          <p>'새로 추천받기' 버튼을 눌러<br>맞춤 뉴스를 확인하세요.</p>
        </div>
      </div>
    </main>


    <aside>
      <div class="sidebar-card">
        <div class="section-title" style="font-size:16px">
          <span><span class="icon">📊</span>관심도 현황</span>
        </div>
        <div id="interestBars">
          <p style="color:var(--muted);font-size:13px;">로그인 후 확인할 수 있습니다.</p>
        </div>
      </div>

      <div class="sidebar-card">
        <div class="section-title" style="font-size:15px;margin-bottom:14px">
          <span>카테고리 안내</span>
        </div>
        <div style="font-size:12px;line-height:2;color:#555">
          기사를 클릭할수록 해당 카테고리의<br>
          관심도 점수가 올라갑니다.<br><br>
          관심도가 높을수록 해당 카테고리 뉴스가<br>
          더 많이 추천됩니다.<br><br>
        </div>
      </div>
    </aside>
  </div>


  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
  <script>
    const d = new Date();
    document.getElementById('todayDate').textContent =
      `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}요일`;
  </script>
</body>

</html>
